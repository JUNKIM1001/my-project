name: ShrineFinder
options:
  bundleIdPrefix: com.omairi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  ShrineFinder:
    type: application
    platform: iOS
    sources:
      - path: ShrineFinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omairi.shrinefinder
        PRODUCT_NAME: ShrineFinder
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: おまいりナビ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "近くの神社・お寺を探すために現在地を使用します。"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
